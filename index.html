<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>새 주문접수채널 미리 써보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 앱 화면(1024×768)을 가운데 무대로, 위에 단계 안내 바, 무대 위에 말풍선 툴팁 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#16201F; --muted:#5B6866; --line:#D5DDDB;
  --mint:#2AC1BC; --mint-ink:#062C2A; --mint-soft:#D6F4F2;
  --stage-shadow:0 4px 16px rgba(10,40,38,.14);
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);margin:0;padding:8px 8px 8px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1024px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.head h1{font-size:clamp(16px,2.4vw,22px);font-weight:900;margin:0;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ctrl{display:flex;gap:8px}
.btn{font:500 13px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--mint)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.hot:focus-visible,.home-btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:0 2px}
.num{flex:none;font-weight:900;font-size:13px;color:var(--mint-ink);background:var(--mint);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.label{flex:1;min-width:0;font-weight:700;font-size:15px}
.disc{color:var(--muted);font-size:12px}
.dots{display:none}
.dots i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--mint)}
@media (max-width:560px){.dots{display:none}}
.stage{position:relative;width:100%;margin:0 auto;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:var(--stage-shadow);background:#000}
.screen{position:absolute;left:0;top:0;width:1024px;height:768px;transform-origin:0 0}
.screen>img.base{position:absolute;inset:0;width:1024px;height:768px;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.scroller{position:absolute;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.scroller::-webkit-scrollbar{display:none}
.hint{position:absolute;z-index:4;background:rgba(22,32,31,.88);color:#fff;border-radius:999px;padding:5px 10px;font:700 clamp(10px,1.2vw,12px)/1.2 var(--f-body);pointer-events:none;display:flex;align-items:center;gap:4px;transform:translate(-100%,-50%);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hint::after{content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;background:inherit;transform:translateY(-50%) rotate(45deg)}
.hint b{font-size:1.25em;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.scroller img{display:block;width:100%;max-width:none}
.sbtn{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:8px}
.sbtn:hover{background:rgba(0,0,0,.04)}
.hot{position:absolute;border-radius:10px;cursor:pointer;background:transparent;border:0;padding:0}
.hot::before{content:"";position:absolute;inset:-4px;border-radius:12px;border:3px solid var(--mint);box-shadow:0 0 0 4px rgba(42,193,188,.25)}
.hot::after{content:"";position:absolute;inset:-4px;border-radius:12px;border:3px solid var(--mint);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.tip{position:absolute;z-index:5;word-break:keep-all;max-width:300px;background:var(--mint);color:var(--mint-ink);border-radius:12px;padding:12px 14px;font:700 clamp(13px,1.9vw,17px)/1.4 var(--f-body);box-shadow:0 10px 28px rgba(0,0,0,.28);pointer-events:none}
.tip small{display:block;font-weight:500;font-size:.8em;opacity:.85;margin-top:2px;white-space:normal}
.tip::after{content:"";position:absolute;width:14px;height:14px;background:var(--mint);transform:rotate(45deg)}
.tip.b::after{top:-6px;left:var(--ax,24px)}
.tip.t::after{bottom:-6px;left:var(--ax,24px)}
.tip.r::after{left:-6px;top:var(--ay,18px)}
.tip.l::after{right:-6px;top:var(--ay,18px)}
.tip{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.tip.show{opacity:1;visibility:visible;transition:opacity .35s ease}
.tip.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.done{position:absolute;left:308px;right:10px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:rise .5s ease-out both}
.done p{margin:0;font:700 18px var(--f-body);color:#16201F}
.home-btn{font:700 18px var(--f-body);color:#fff;background:#16201F;border:0;border-radius:12px;padding:16px 36px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.home-btn:hover{background:#000}
@keyframes rise{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.note{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){.hot::after,.done,.tip.shake,.hint b{animation:none}.tip,.tip.show{transition:none}}
</style>
</head><body>

<div class="wrap">
  <div class="head">
    <div>
      <h1>달라지는 배민주문접수PC 미리 만나요!</h1>
    </div>
    <div class="ctrl">
      <button class="btn" id="prev" type="button">이전</button>
      <button class="btn" id="restart" type="button">처음부터</button>
    </div>
  </div>
  <div class="bar" aria-live="polite">
    <span class="num" id="num">1 / 10</span>
    <span class="label" id="label"></span>
    <span class="disc">화면은 이해를 돕기 위한 예시이며, 실제 화면과 다를 수 있어요.</span>
    <span class="dots" id="dots"></span>
  </div>
  <div class="stage" id="stage"><div class="screen" id="screen"></div></div>
</div>

<script>
const IMG={"s01_login": "images/s01_login.webp", "s02_home": "images/s02_home.webp", "s02_scroll": "images/s02_scroll.webp", "s03_status": "images/s03_status.webp", "s04_cs": "images/s04_cs.webp", "s05_noti": "images/s05_noti.webp", "s06_tray": "images/s06_tray.webp", "s07_cards": "images/s07_cards.webp", "s08_history": "images/s08_history.webp", "s09_program": "images/s09_program.webp", "s10_receipt": "images/s10_receipt.webp", "s10_scroll": "images/s10_scroll.webp", "s11_test": "images/s11_test.webp"};
const STEPS=[
 {img:'s01_login',label:'로그인하기',hot:[329,440,367,48],tip:'로그인 버튼을 눌러보세요',pos:'b'},
 {img:'s02_home',label:'새로워진 홈 화면',hot:[160,18,136,36],tip:'영업현황 버튼을 눌러보세요',sub:'가게 영업 현황을 확인할 수 있어요.',pos:'b',
  scroll:{x:104,y:128,w:854,h:630,img:'s02_scroll',hint:[952,443],br:'0 0 0 16px',arrows:[[958,144,48,299,-1],[958,443,48,299,1]]}},
 {img:'s03_status',label:'영업현황 확인하기',hot:[964,16,40,40],tip:'고객센터 버튼을 눌러보세요',pos:'b',align:'right'},
 {img:'s04_cs',label:'고객센터 열어보기',hot:[900,16,40,40],tip:'알림센터 버튼을 눌러보세요',pos:'l'},
 {img:'s05_noti',label:'알림센터 확인하기',hot:[12,178,80,74],tip:'처리중 버튼을 눌러보세요',pos:'r'},
 {img:'s06_tray',label:'처리중 주문 확인',hot:[955,82,40,40],tip:'카드형 목록 버튼을 눌러보세요',sub:'주문을 카드 모양으로 볼 수 있어요.',pos:'b',align:'right'},
 {img:'s07_cards',label:'카드형 목록으로 보기',hot:[12,268,80,74],tip:'주문내역 버튼을 눌러보세요',pos:'r'},
 {img:'s08_history',label:'주문내역 확인하기',hot:[12,358,80,74],tip:'설정 버튼을 눌러보세요',pos:'r'},
 {img:'s09_program',label:'설정 화면',hot:[104,288,196,48],tip:'영수증 설정 버튼을 눌러보세요',pos:'r'},
 {img:'s10_receipt',label:'영수증 설정',hot:[104,384,196,48],tip:'테스트 주문 버튼을 눌러보세요',sub:'주문 유형별로 테스트 주문을 할 수 있어요.',pos:'b',maxw:196,
  scroll:{x:308,y:72,w:638,h:686,img:'s10_scroll',hint:[944,330]}},
 {img:'s11_test',label:'테스트 주문 화면',final:true}
];
const $=id=>document.getElementById(id);
const screen=$('screen'), stage=$('stage');
let cur=0, tipTimer=null;
function showTip(){clearTimeout(tipTimer);const t=stage.querySelector('.tip');if(t)t.classList.add('show')}
$('dots').innerHTML=Array.from({length:10},()=>'<i></i>').join('');
function sizeStage(){const wrap=stage.parentElement, note=document.querySelector('.note');
  const avail=window.innerHeight-stage.offsetTop-10;
  const w=Math.min(wrap.clientWidth,Math.max(320,avail*4/3)); stage.style.width=Math.floor(w)+'px';}
window.addEventListener('resize',sizeStage);
function fit(){screen.style.transform='scale('+(stage.clientWidth/1024)+')';placeTip()}
new ResizeObserver(fit).observe(stage);
function render(){
  const s=STEPS[cur];
  clearTimeout(tipTimer); screen.innerHTML=''; stage.querySelectorAll('.tip,.hint').forEach(e=>e.remove());
  const base=new Image(); base.className='base'; base.src=IMG[s.img]; base.alt=s.label+' 화면'; base.draggable=false;
  screen.appendChild(base);
  if(s.scroll){const d=document.createElement('div');d.className='scroller';
    Object.assign(d.style,{left:s.scroll.x+'px',top:s.scroll.y+'px',width:s.scroll.w+'px',height:s.scroll.h+'px'});
    if(s.scroll.br) d.style.borderRadius=s.scroll.br;
    const im=new Image(); im.src=IMG[s.scroll.img]; im.alt=''; d.appendChild(im); screen.appendChild(d);
    (s.scroll.arrows||[]).forEach(([ax,ay,aw,ah,dir])=>{const a=document.createElement('button');a.type='button';a.className='sbtn';a.setAttribute('aria-label',dir<0?'위로 스크롤':'아래로 스크롤');
      Object.assign(a.style,{left:ax+'px',top:ay+'px',width:aw+'px',height:ah+'px'});a.onclick=e=>{e.stopPropagation();d.scrollBy({top:dir*300,behavior:'smooth'})};screen.appendChild(a);});
    if(s.scroll.hint){const hn=document.createElement('div');hn.className='hint';hn.innerHTML='<b>↕</b>스크롤해 보세요';hn.setAttribute('aria-label','위아래로 스크롤해 보세요');stage.appendChild(hn);}}
  const n=Math.min(cur+1,10);
  $('num').textContent=s.final?'완료':n+' / 10';
  $('label').textContent=s.label;
  [...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i<(s.final?10:n)));
  $('prev').disabled=cur===0;
  if(s.final){
    const w=document.createElement('div'); w.className='done';
    w.innerHTML='<p>새 주문접수채널 둘러보기를 모두 마쳤어요!</p><button class="home-btn" type="button">처음으로 돌아가기</button>';
    w.querySelector('button').onclick=()=>go(0);
    screen.appendChild(w); return;
  }
  const [x,y,w,h]=s.hot;
  const b=document.createElement('button'); b.type='button'; b.className='hot'; b.setAttribute('aria-label',s.tip);
  Object.assign(b.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  b.onclick=e=>{e.stopPropagation();go(cur+1)};
  screen.appendChild(b);
  const t=document.createElement('div'); t.className='tip '+s.pos; t.innerHTML=s.tip+(s.sub?'<small>'+s.sub+'</small>':'');
  stage.appendChild(t); placeTip();
  tipTimer=setTimeout(showTip,1500);
}
function placeTip(){
  const hn=stage.querySelector('.hint'), S=STEPS[cur]; if(hn&&S.scroll&&S.scroll.hint){const kk=stage.clientWidth/1024; hn.style.left=(S.scroll.hint[0]*kk)+'px'; hn.style.top=(S.scroll.hint[1]*kk)+'px';}
  const t=stage.querySelector('.tip'), s=STEPS[cur]; if(!t||s.final) return;
  const k=stage.clientWidth/1024, SW=stage.clientWidth, [x0,y0,w0,h0]=s.hot;
  const x=x0*k,y=y0*k,w=w0*k,h=h0*k, G=12;
  t.style.width=''; t.style.whiteSpace='nowrap'; let tw=Math.min(Math.ceil(t.getBoundingClientRect().width)+2,SW-16); if(s.maxw) tw=Math.min(tw,Math.max(s.maxw*k,150)); t.style.width=tw+'px'; t.style.whiteSpace='';
  const th=t.offsetHeight;
  if(s.pos==='b'){
    let left=s.align==='right'? x+w-tw+4 : x-4;
    left=Math.max(8,Math.min(SW-8-tw,left));
    t.style.left=left+'px'; t.style.top=(y+h+G)+'px';
    t.style.setProperty('--ax',Math.max(12,Math.min(tw-26,x+w/2-left-7))+'px');
  }else if(s.pos==='l'){
    t.style.left=Math.max(8,x-G-tw)+'px'; const top=Math.max(8,y+h/2-th/2); t.style.top=top+'px';
    t.style.setProperty('--ay',Math.max(10,y+h/2-top-7)+'px');
  }else{
    t.style.left=(x+w+G)+'px'; const top=Math.max(8,y+h/2-th/2); t.style.top=top+'px';
    t.style.setProperty('--ay',Math.max(10,y+h/2-top-7)+'px');
  }
}
screen.addEventListener('click',()=>{const t=stage.querySelector('.tip');if(!t)return;showTip();t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')});
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();}
$('prev').onclick=()=>go(cur-1);
$('restart').onclick=()=>go(0);
Object.values(IMG).forEach(src=>{const i=new Image();i.src=src});
sizeStage(); fit(); render();
</script>

</body></html>
