<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>새 주문접수채널 미리 써보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 제목 한 줄 + 앱 화면(4:3) 무대. 화면 요소는 % 좌표로 배치(축소 렌더링 없이 이미지 원본 해상도 사용) */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#16201F; --muted:#5B6866; --line:#D5DDDB;
  --mint:#2AC1BC; --mint-ink:#062C2A; --mint-soft:#E3F7F6;
  --stage-shadow:0 4px 16px rgba(10,40,38,.14);
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);margin:0;padding:6px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1024px;margin:0 auto;display:flex;flex-direction:column;gap:8px;border:1px solid #DDE3E2;border-radius:16px;padding:10px;background:#fff}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.head h1{font-size:clamp(16px,2.4vw,22px);font-weight:900;margin:0;letter-spacing:-.02em;text-wrap:balance}
.ctrl{display:flex;gap:8px}
.btn{font:500 13px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--mint)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.hot:focus-visible,.home-btn:focus-visible,.info button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.stage{position:relative;width:100%;margin:0 auto;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:var(--stage-shadow);background:#000;--k:1}
.screen{position:absolute;inset:0}
.screen>img.base{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.scroller{position:absolute;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.scroller::-webkit-scrollbar{display:none}
.scroller img{display:block;width:100%;max-width:none}
.sbtn{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:8px}
.sbtn:hover{background:rgba(0,0,0,.04)}
.hint{position:absolute;z-index:4;background:rgba(22,32,31,.88);color:#fff;border-radius:999px;padding:5px 10px;font:700 clamp(10px,1.2vw,12px)/1.2 var(--f-body);pointer-events:none;display:flex;align-items:center;gap:4px;transform:translate(-100%,-50%);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:opacity .3s}
.hint::after{content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;background:inherit;transform:translateY(-50%) rotate(45deg)}
.hint b{font-size:1.25em;animation:bob 1.2s ease-in-out infinite}
.hint.gone{opacity:0}
.hint[hidden]{display:none}
@keyframes bob{50%{transform:translateY(3px)}}
.hot{position:absolute;border-radius:10px;cursor:pointer;background:transparent;border:0;padding:0}
.hot::before{content:"";position:absolute;inset:-4px;border-radius:12px;border:3px solid var(--mint);box-shadow:0 0 0 4px rgba(42,193,188,.25)}
.hot::after{content:"";position:absolute;inset:-4px;border-radius:12px;border:3px solid var(--mint);animation:ping 1.6s ease-out infinite}
.hot.wait{visibility:hidden}
.hot.nudge{animation:nudge .6s ease-in-out}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px) rotate(-2deg)}30%{transform:translateX(7px) rotate(2deg)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tip{position:absolute;z-index:5;word-break:keep-all;max-width:300px;background:var(--mint);color:var(--mint-ink);border-radius:12px;padding:12px 34px 12px 14px;font:700 clamp(13px,1.9vw,17px)/1.4 var(--f-body);box-shadow:0 10px 28px rgba(0,0,0,.28);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.tip.show{opacity:1;visibility:visible;transition:opacity .35s ease}
.tip::after{content:"";position:absolute;width:14px;height:14px;background:var(--mint);transform:rotate(45deg)}
.tip.b::after{top:-6px;left:var(--ax,24px)}
.tip.r::after{left:-6px;top:var(--ay,18px)}
.tip.l::after{right:-6px;top:var(--ay,18px)}
.tip.shake{animation:shake .5s}
.tip-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--mint-ink);font:700 16px/1 var(--f-body);cursor:pointer;pointer-events:auto;display:grid;place-items:center;opacity:.75}
.tip-x:hover{opacity:1;background:rgba(6,44,42,.1)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
/* 설명 팝업 */
.info{position:absolute;z-index:6;background:#fff;color:var(--fg);border-radius:16px;padding:20px 20px 16px;box-shadow:0 18px 48px rgba(0,0,0,.35);word-break:keep-all;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
.info .tag{display:inline-block;font:700 clamp(12px,1.4vw,14px)/1 var(--f-body);color:var(--mint-ink);background:var(--mint-soft);border-radius:999px;padding:6px 10px;margin-bottom:10px}
.info p{margin:0 0 16px;font:700 clamp(14px,1.8vw,18px)/1.5 var(--f-body);text-wrap:pretty}
.info .ok{display:block;width:100%;border:0;border-radius:10px;background:var(--mint);color:var(--mint-ink);font:700 clamp(14px,1.6vw,16px) var(--f-body);padding:11px 0;cursor:pointer}
.info .ok:hover{filter:brightness(.95)}
.info .x{position:absolute;top:10px;right:10px;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:700 18px/1 var(--f-body);cursor:pointer}
.info .x:hover{background:#F1F4F4}
.info.shake{animation:shake .5s}
.focus{position:absolute;z-index:5;border:3px solid var(--mint);border-radius:calc(14px * var(--k));box-shadow:0 0 0 4px rgba(42,193,188,.35),0 0 0 9999px rgba(10,16,16,.5);pointer-events:none;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 9px rgba(42,193,188,.25),0 0 0 9999px rgba(10,16,16,.5)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.done{position:absolute;left:30.08%;right:.98%;bottom:3.9%;display:flex;justify-content:center;animation:rise .5s ease-out both}
.home-btn{font:700 calc(22px * var(--k)) var(--f-body);color:#fff;background:#16201F;border:0;border-radius:calc(14px * var(--k));padding:calc(20px * var(--k)) calc(52px * var(--k));cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.home-btn:hover{background:#000}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.done.card{left:29.3%;right:20.1%}
.wrap.bare{border:0;padding:0;border-radius:0;gap:0}
.wrap.bare .head{display:none}
.wrap.bare .stage{box-shadow:none;border-radius:0}
body:has(.wrap.bare){padding:0}
@media (prefers-reduced-motion:reduce){.focus,.hot::after,.done,.tip.shake,.hint b,.hot.nudge,.info,.info.shake{animation:none}.tip,.tip.show{transition:none}}
</style>
</head><body>

<div class="wrap bare">
  <div class="head">
    <h1>달라지는 배민주문접수PC 미리 만나요!</h1>
    <div class="ctrl">
      <button class="btn" id="prev" type="button">이전</button>
      <button class="btn" id="restart" type="button">처음부터</button>
    </div>
  </div>
  <div class="stage" id="stage"><div class="screen" id="screen"></div></div>
</div>

<script>
const IMG={"s02_home": "images/s02_home.webp", "s02_scroll": "images/s02_scroll.webp"};
const STEPS=[
 {img:'s02_home',label:'홈 화면',
  info:{tag:'홈 화면',text:'배민셀프서비스를 그대로 이용할 수 있어요.'},
  scroll:{x:104,y:128,w:854,h:630,img:'s02_scroll',hint:[952,443],br:'0 0 0 16px',arrows:[[958,144,48,299,-1],[958,443,48,299,1]]}}
];
const $=id=>document.getElementById(id);
const screen=$('screen'), stage=$('stage');
let cur=0, timers=[], idle=null, tipClosed=false, infoOpen=false;
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
function clearAll(){timers.forEach(clearTimeout);timers=[];clearInterval(idle);idle=null}
const pct=(el,x,y,w,h)=>Object.assign(el.style,{left:x/10.24+'%',top:y/7.68+'%',width:w/10.24+'%',height:h/7.68+'%'});

function sizeStage(){const wrap=stage.parentElement;
  const bare=wrap.classList.contains('bare'); const avail=window.innerHeight-(stage.getBoundingClientRect().top+window.scrollY)-(bare?0:19);
  const w=Math.min(wrap.clientWidth-(wrap.classList.contains('bare')?0:20),Math.max(320,avail*4/3)); stage.style.width=Math.floor(w)+'px';}
window.addEventListener('resize',sizeStage);
function fit(){stage.style.setProperty('--k',stage.clientWidth/1024);placeAll()}
new ResizeObserver(fit).observe(stage);

function nudge(){
  const h=screen.querySelector('.hot'); if(!h||h.classList.contains('wait')) return;
  h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge');
  const t=stage.querySelector('.tip'); if(t&&!tipClosed){t.classList.add('show');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}
}
function startIdle(){clearInterval(idle);idle=setInterval(nudge,5000)}
function revealButton(){
  const h=screen.querySelector('.hot'); if(h) h.classList.remove('wait');
  const t=stage.querySelector('.tip'); if(t&&!tipClosed) t.classList.add('show');
  startIdle();
}
function showHint(){const hn=stage.querySelector('.hint'); if(hn) hn.hidden=false}
function showDone(){
  const w=document.createElement('div'); w.className='done';
  w.innerHTML='<button class="home-btn" type="button">처음으로 돌아가기</button>';
  w.querySelector('button').onclick=e=>{e.stopPropagation();go(0)};
  screen.appendChild(w);
}
function closeInfo(e){
  if(e) e.stopPropagation();
  const p=stage.querySelector('.info'); if(p) p.remove(); const fc=stage.querySelector('.focus'); if(fc) fc.remove(); infoOpen=false;
  showHint();
  const s=STEPS[cur];
  if(s.final) later(showDone,2000); else later(revealButton,2000);
}

function render(){
  const s=STEPS[cur];
  clearAll(); tipClosed=false; infoOpen=false;
  screen.innerHTML=''; stage.querySelectorAll('.tip,.hint,.info,.focus').forEach(e=>e.remove());
  const base=new Image(); base.className='base'; base.src=IMG[s.img]; base.alt=s.label+' 화면'; base.draggable=false;
  screen.appendChild(base);
  if(s.scroll){
    const d=document.createElement('div'); d.className='scroller'; pct(d,s.scroll.x,s.scroll.y,s.scroll.w,s.scroll.h);
    if(s.scroll.br) d.style.borderRadius=s.scroll.br;
    const im=new Image(); im.src=IMG[s.scroll.img]; im.alt=''; d.appendChild(im); screen.appendChild(d);
    (s.scroll.arrows||[]).forEach(([ax,ay,aw,ah,dir])=>{const a=document.createElement('button');a.type='button';a.className='sbtn';a.setAttribute('aria-label',dir<0?'위로 스크롤':'아래로 스크롤');
      pct(a,ax,ay,aw,ah);a.onclick=e=>{e.stopPropagation();d.scrollBy({top:dir*d.clientHeight*.45,behavior:'smooth'})};screen.appendChild(a);});
    if(s.scroll.hint){const hn=document.createElement('div');hn.className='hint';hn.innerHTML='<b>↕</b>스크롤해 보세요';hn.setAttribute('aria-label','위아래로 스크롤해 보세요');
      if(s.info) hn.hidden=true; stage.appendChild(hn);
      d.addEventListener('scroll',()=>{if(d.scrollTop>8&&!hn.classList.contains('gone')){hn.classList.add('gone');setTimeout(()=>hn.remove(),300)}},{passive:true});}
  }
  $('prev').disabled=cur===0;
  if(!s.final&&s.hot){
    const [x,y,w,h]=s.hot;
    const b=document.createElement('button'); b.type='button'; b.className='hot'+(s.info?' wait':''); b.setAttribute('aria-label',s.tip);
    pct(b,x,y,w,h);
    b.onclick=e=>{e.stopPropagation();go(s.next!=null?s.next:cur+1)};
    b.addEventListener('animationend',ev=>{if(ev.animationName==='nudge')b.classList.remove('nudge')});
    screen.appendChild(b);
    const t=document.createElement('div'); t.className='tip '+s.pos; t.innerHTML=s.tip+'<button type="button" class="tip-x" aria-label="안내 닫기">×</button>';
    t.querySelector('.tip-x').addEventListener('click',e=>{e.stopPropagation();tipClosed=true;t.remove()});
    stage.appendChild(t);
  }
  if(s.info){
    infoOpen=true;
    const p=document.createElement('div'); p.className='info'; p.setAttribute('role','dialog');
    p.innerHTML='<button type="button" class="x" aria-label="설명 닫기">×</button><span class="tag">'+s.info.tag+'</span><p>'+s.info.text+'</p><button type="button" class="ok">확인</button>';
    p.querySelector('.x').onclick=closeInfo; p.querySelector('.ok').onclick=closeInfo;
    p.addEventListener('click',e=>e.stopPropagation());
    if(s.info.box){const fc=document.createElement('div'); fc.className='focus'; pct(fc,...s.info.box); stage.appendChild(fc);}
    stage.appendChild(p);
  }else if(s.final){later(showDone,1000)}
  else{later(revealButton,1000)}
  placeAll();
}

function placeAll(){
  const s=STEPS[cur], k=stage.clientWidth/1024, SW=stage.clientWidth, SH=stage.clientHeight;
  const hn=stage.querySelector('.hint'); if(hn&&s.scroll&&s.scroll.hint){hn.style.left=(s.scroll.hint[0]*k)+'px'; hn.style.top=(s.scroll.hint[1]*k)+'px';}
  const p=stage.querySelector('.info');
  if(p){
    const pw=Math.min(360,SW-32); p.style.width=pw+'px'; const ph=p.offsetHeight;
    let left=(SW-pw)/2, top=(SH-ph)/2;
    if(s.info.at){const [ax,ay,al]=s.info.at; left=al==='l'?ax*k+16:ax*k-16-pw; top=ay*k-ph/2;}
    p.style.left=Math.max(12,Math.min(SW-12-pw,left))+'px'; p.style.top=Math.max(12,Math.min(SH-12-ph,top))+'px';
  }
  const t=stage.querySelector('.tip'); if(!t||s.final) return;
  const [x0,y0,w0,h0]=s.hot; const x=x0*k,y=y0*k,w=w0*k,h=h0*k, G=12;
  t.style.width=''; t.style.whiteSpace='nowrap'; let tw=Math.min(Math.ceil(t.getBoundingClientRect().width)+2,SW-16); if(s.maxw) tw=Math.min(tw,Math.max(s.maxw*k,150)); t.style.width=tw+'px'; t.style.whiteSpace='';
  const th=t.offsetHeight;
  if(s.pos==='b'){
    let left=s.align==='right'? x+w-tw+4 : x-4; left=Math.max(8,Math.min(SW-8-tw,left));
    t.style.left=left+'px'; t.style.top=(y+h+G)+'px'; t.style.setProperty('--ax',Math.max(12,Math.min(tw-26,x+w/2-left-7))+'px');
  }else if(s.pos==='l'){
    t.style.left=Math.max(8,x-G-tw)+'px'; const top=Math.max(8,y+h/2-th/2); t.style.top=top+'px'; t.style.setProperty('--ay',Math.max(10,y+h/2-top-7)+'px');
  }else{
    t.style.left=(x+w+G)+'px'; const top=Math.max(8,y+h/2-th/2); t.style.top=top+'px'; t.style.setProperty('--ay',Math.max(10,y+h/2-top-7)+'px');
  }
}
screen.addEventListener('click',()=>{
  if(infoOpen){const p=stage.querySelector('.info'); if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')} return;}
  nudge(); startIdle();
});
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();}
$('prev').onclick=()=>go(cur-1);
$('restart').onclick=()=>go(0);
Object.values(IMG).forEach(src=>{const i=new Image();i.src=src});
sizeStage(); fit(); render();
</script>

</body></html>
